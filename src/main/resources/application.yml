spring:
  application:
    name: pet-battle-game

  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/pet_battle?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update  # 自动创建/更新表结构
    show-sql: true      # 显示SQL语句
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true  # 格式化SQL

  # Redis配置（用于匹配队列和缓存）
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms

# 服务器配置
server:
  port: 8080

# 日志配置
logging:
  level:
    root: INFO
    com.yourname.petbattle: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
